name: 功能需求建議
description: 為此專案提出想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感謝您提出功能建議！
  - type: textarea
    id: problem
    attributes:
      label: 問題陳述
      description: 此功能解決了什麼問題？痛點為何？
      placeholder: 令人困擾的是...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議解決方案
      description: 描述您希望看到的行為。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
      description: 您嘗試過的任何因應措施或替代方法。
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 範圍
      description: 這項變更的規模有多大？
      options:
        - Small (bugfix-like, < 100 lines)
        - Medium (new module, ~100-500 lines)
        - Large (architectural change)
      default: 0
    validations:
      required: true
